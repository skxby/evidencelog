# Alembic configuration for Log Intelligence Agent V1.
#
# NOTE: this file is intentionally ASCII-only.
# Alembic reads it via ConfigParser with encoding="locale"
# (alembic/util/compat.py -> file_config.read(..., encoding="locale")).
# On a zh-CN Windows host the locale encoding is GBK, so any non-ASCII character
# here breaks `alembic` itself with UnicodeDecodeError. Keep this file ASCII.
#
# The database URL is NOT stored here: migrations/env.py resolves it from the
# environment first (see _database_url), so configuration has a single source
# and an overridden DATABASE_URL is actually honoured.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S