[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
addopts = -ra -q
markers =
    integration: 需要真实 PostgreSQL / Redis（先执行 docker compose up -d）
filterwarnings =
    # 已知上游弃用（**记录在此，不是忽略**）：Starlette 1.7 起要求把 TestClient 的
    # httpx 换成 httpx2。换它会波及所有用 TestClient 的集成测试（整个 tests/integration），
    # 收益不抵风险 —— 等上游正式切换再动。评估结论见 README 第 7 节。
    # 之所以显式列出来：**假警多了真警就没人看**，一条已知告警不该出现在每次输出的
    # 告警摘要里；这样一旦出现别的告警，它一眼就能被看见。
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
