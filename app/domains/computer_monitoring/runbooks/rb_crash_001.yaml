id: rb_crash_001
title: 进程崩溃处置
applies:
  analyzer: ProcessCrash
  # 关键词表必须与 analyzer 的 CRASH_PATTERNS 对齐（app/domains/computer_monitoring/
  # analyzers/__init__.py）。`crash` 是最常见的命中词（崩溃上报进程名里就有），
  # 漏了它 = 真机上一份 runbook 都挂不上（2026-09-24 真机核验）。
  message_pattern: "segfault|segmentation fault|core dumped|panic|crash"
steps:
  - "确认崩溃进程名、PID 与崩溃时间点"
  - "检查是否有 core dump 生成，路径与大小"
  - "查看崩溃前后同一进程的日志，确认是否有前置异常"
  - "确认崩溃是单次还是周期性（周期性与单次的处置完全不同）"
  - "核对近期是否有版本升级、依赖变更或配置改动"
  - "确认该进程是否被 supervisor / systemd 自动拉起，以及重启次数"
references: []
